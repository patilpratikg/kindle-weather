name: Render dashboard

on:
  schedule:
    # Every 30 min at :07 and :37, 06:07-21:37 Pune time only (nothing changes overnight).
    # GitHub cron is in UTC; Pune is UTC+5:30. Off-peak minutes avoid :00/:30, when GitHub
    # often delays or drops scheduled runs.
    - cron: '37 0 * * *'         # 06:07 IST
    - cron: '7,37 1-15 * * *'    # 06:37 - 21:07 IST
    - cron: '7 16 * * *'         # 21:37 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Draw the image and upload it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # Publish it. A separate job only starts once the upload is fully stored, which avoids the
  # "No artifacts named github-pages were found" failure seen when deploy ran in the same job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
