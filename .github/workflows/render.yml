name: Render dashboard

on:
  schedule:
    # Every 30 min at :07 and :37, 06:07-21:37 Pune time only (nothing changes overnight).
    # GitHub cron is in UTC; Pune is UTC+5:30. Off-peak minutes avoid :00/:30, when GitHub
    # often delays or drops scheduled runs.
    - cron: '37 0 * * *'         # 06:07 IST
    - cron: '7,37 1-15 * * *'    # 06:37 - 21:07 IST
    - cron: '7 16 * * *'         # 21:37 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
