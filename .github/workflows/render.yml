name: Render dashboard

on:
  schedule:
    # At :25 and :55 Pune time, 05:55-21:25: five minutes before each Kindle refresh at :00/:30,
    # each run draws the picture for that next slot. GitHub cron is in UTC (Pune = UTC+5:30),
    # so UTC :25 is Pune :55 and UTC :55 is Pune :25 of the next hour.
    - cron: '25,55 0-15 * * *'   # 05:55, 06:25, ... 21:25 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Draw the image and upload it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # Publish it. A separate job only starts once the upload is fully stored, which avoids the
  # "No artifacts named github-pages were found" failure seen when deploy ran in the same job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
